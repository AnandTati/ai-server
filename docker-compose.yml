# =============================================================================
# AI Stack - Docker Compose Configuration
# =============================================================================
#
# Services:
#   1. Ollama: Local LLM inference engine with GPU support
#   2. Smart Router: Intelligent query routing with FAISS memory
#   3. OpenWebUI: Web interface for interacting with AI models
#   4. Whisper: Speech-to-text transcription
#   5. SearXNG: Self-hosted web search engine
#
# Models (2-model setup for 12GB VRAM):
#   - deepseek-r1:14b    - Coding + reasoning (~9GB)
#   - qwen3:8b           - General + summarization (~5GB)
#
# Data stored in ./data/ for easy backup:
#   - data/ollama/       Model weights (~20GB+)
#   - data/openwebui/    User accounts, chat history
#   - data/smart-router/ FAISS index, SQLite database
#   - data/searxng/      Search engine config
#
# Usage:
#   Start:  docker compose up -d
#   Stop:   docker compose down
#   Logs:   docker compose logs -f [service]
#
# =============================================================================

networks:
  ai-net:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Ollama - Local LLM Inference Engine
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks: [ai-net]
    volumes:
      - ./data/ollama:/root/.ollama
    env_file:
      - ./ollama/models.env
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # Smart Router - Intelligent Query Routing with Memory
  # ---------------------------------------------------------------------------
  router:
    build: ./smart-router
    container_name: ai-router
    restart: unless-stopped
    depends_on: [ollama]
    networks: [ai-net]
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - CODING_MODEL=deepseek-r1:14b
      - GENERAL_MODEL=gemma2:9b
      - EMBEDDING_MODEL=nomic-embed-text
      - DATA_DIR=/data
    ports:
      - "8000:8000"
    volumes:
      - ./data/smart-router:/data

  # ---------------------------------------------------------------------------
  # SearXNG - Self-hosted Web Search Engine
  # ---------------------------------------------------------------------------
  # Privacy-respecting metasearch engine that aggregates results from
  # multiple search engines (Google, Bing, DuckDuckGo, etc.)
  # Access: http://localhost:8080 (internal use by OpenWebUI)
  # ---------------------------------------------------------------------------
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks: [ai-net]
    ports:
      - "8080:8080"
    volumes:
      - ./data/searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  # ---------------------------------------------------------------------------
  # OpenWebUI - Web Interface with Web Search
  # ---------------------------------------------------------------------------
  # Connects to Smart Router and SearXNG for intelligent routing + web search
  # Access: http://localhost:3000
  # ---------------------------------------------------------------------------
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    depends_on: [router, searxng]
    networks: [ai-net]
    ports:
      - "3000:8080"
    environment:
      # Connect to Smart Router
      OPENAI_API_BASE_URL: http://router:8000/v1
      OPENAI_API_KEY: local-ai
      # Enable Web Search with SearXNG
      ENABLE_RAG_WEB_SEARCH: "true"
      RAG_WEB_SEARCH_ENGINE: "searxng"
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>&format=json"
    volumes:
      - ./data/openwebui:/app/backend/data

  # ---------------------------------------------------------------------------
  # Whisper - Speech-to-Text
  # ---------------------------------------------------------------------------
  whisper:
    build: ./whisper
    container_name: whisper
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
