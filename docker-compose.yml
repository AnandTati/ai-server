networks:
  ai-net:
    driver: bridge

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks:
      - ai-net
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_MODELS=/root/.ollama/models
    # Ensure Ollama uses the GPU to prevent slow-load timeouts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  router:
    build: ./router
    container_name: ai-router
    restart: unless-stopped
    depends_on:
      - ollama
    networks:
      - ai-net
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    expose:
      - "8000"
    volumes:
      - ./data/faiss:/app/faiss

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    depends_on:
      - router
    networks:
      - ai-net
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://router:8000/v1
      OPENAI_API_KEY: local-ai
    volumes:
      - ./data/openwebui:/app/backend/data

  whisper:
    build: ./whisper
    container_name: whisper
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

