# =============================================================================
# AI Stack - Docker Compose Configuration
# =============================================================================
#
# Services:
#   1. Ollama: Local LLM inference engine with GPU support
#   2. Smart Router: Intelligent query routing with FAISS memory
#   3. OpenWebUI: Web interface for interacting with AI models
#   4. Whisper: Speech-to-text transcription
#   5. SearXNG: Self-hosted web search engine
#
# Configuration:
#   All model settings are in models.env - edit that to change models
#
# Data stored in ./data/ for easy backup:
#   - data/ollama/       Model weights (~20GB+)
#   - data/openwebui/    User accounts, chat history
#   - data/smart-router/ FAISS index, SQLite database
#   - data/searxng/      Search engine config
#
# Usage:
#   Start:  docker compose up -d
#   Stop:   docker compose down
#   Logs:   docker compose logs -f [service]
#
# =============================================================================

networks:
  ai-net:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Ollama - Local LLM Inference Engine
  # ---------------------------------------------------------------------------
  # Runs large language models locally with GPU acceleration.
  # OLLAMA_KEEP_ALIVE=-1 keeps models loaded indefinitely.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks: [ai-net]
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # Smart Router - Intelligent Query Routing with Memory
  # ---------------------------------------------------------------------------
  # Routes queries to the appropriate model based on content analysis.
  # Uses models.env for model configuration.
  #
  # Features:
  #   - Keyword-based query classification
  #   - FAISS-powered semantic search for context retrieval
  #   - Cross-session conversation memory
  #   - Auto URL fetching and web search
  # ---------------------------------------------------------------------------
  router:
    build: ./smart-router
    container_name: ai-router
    restart: unless-stopped
    depends_on: [ollama]
    networks: [ai-net]
    env_file:
      - models.env
    environment:
      # Data directory (inside container)
      - DATA_DIR=/data
    ports:
      - "8000:8000"
    volumes:
      # Persist FAISS index and SQLite database
      - ./data/smart-router:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # SearXNG - Self-hosted Web Search Engine
  # ---------------------------------------------------------------------------
  # Privacy-respecting metasearch engine that aggregates results from
  # multiple search engines (Google, Bing, DuckDuckGo, etc.)
  # Access: http://localhost:8080 (internal use by OpenWebUI)
  # ---------------------------------------------------------------------------
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks: [ai-net]
    ports:
      - "8080:8080"
    volumes:
      - ./data/searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  # ---------------------------------------------------------------------------
  # OpenWebUI - Web Interface with Web Search
  # ---------------------------------------------------------------------------
  # Connects to Smart Router and SearXNG for intelligent routing + web search
  # Access: http://localhost:3000
  # ---------------------------------------------------------------------------
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    depends_on: [router, searxng]
    networks: [ai-net]
    ports:
      - "3000:8080"
    environment:
      # Connect to Smart Router
      OPENAI_API_BASE_URL: http://router:8000/v1
      OPENAI_API_KEY: local-ai
      # Set default model to "auto" for smart routing
      DEFAULT_MODELS: "auto"
      # Enable Web Search with SearXNG
      ENABLE_RAG_WEB_SEARCH: "true"
      RAG_WEB_SEARCH_ENGINE: "searxng"
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>&format=json"
    volumes:
      - ./data/openwebui:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Whisper - Speech-to-Text
  # ---------------------------------------------------------------------------
  # Transcribes audio to text using OpenAI Whisper model.
  # Only accessible from localhost for security.
  # ---------------------------------------------------------------------------
  whisper:
    build: ./whisper
    container_name: whisper
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
